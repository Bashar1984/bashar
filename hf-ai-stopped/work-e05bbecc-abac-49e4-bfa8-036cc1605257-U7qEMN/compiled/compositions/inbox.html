    const N = 16, H = 100;
    const times = [];
    let t = 0.6, gap = 0.55;
    for (let i = 0; i < N; i++) { times.push(t); t += gap; gap = Math.max(0.12, gap * 0.8); }

        tl.fromTo("#ib-r" + i, { y: (j - i - 1) * H }, { y: (j - i) * H, duration: 0.18, ease: "power2.out", immediateRender: false }, times[j]);

    }
    const badge = document.querySelector("#ib-badge");
    const counts = ["3", "4", "6", "9", "14", "22", "37", "58", "99+"];
    const clock = { s: 0 };

      const arrived = times.filter((x) => x <= clock.s).length;
      badge.textContent = counts[Math.min(counts.length - 1, Math.ceil(arrived / 2))];

    // 45.6% counts up
